[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calcutils-edouard144"
version = "0.1.0"
description = "A simple student tutorial math utility package"
readme = "README.md"
authors = [{ name = "Edouard TUYUBAHE" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/Edouard144/calcutils"

[tool.setuptools.packages.find]
where = ["src"]